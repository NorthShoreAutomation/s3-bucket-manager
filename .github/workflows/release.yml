name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.6.0). Used by auto-release.yml to chain into this workflow, and for manual backfills of releases whose tag-push never triggered this workflow."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "$TAG" || "$TAG" != v* ]]; then
            echo "Resolved tag '$TAG' is not a valid v* tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${TAG}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Extract release notes from CHANGELOG or tag annotation
        id: release_notes
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [VERSION]" to the next "## [" heading
          awk '/^## \['"${VERSION}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > /tmp/release_notes.md
          # Trim leading/trailing blank lines
          sed -i '/./,$!d' /tmp/release_notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release_notes.md
          if [[ -s /tmp/release_notes.md ]]; then
            echo "Found release notes for v${VERSION} in CHANGELOG.md"
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            # Fall back to an annotated tag message when auto-release cannot
            # update protected main with a changelog commit.
            git for-each-ref "refs/tags/v${VERSION}" --format='%(contents)' | tail -n +2 > /tmp/release_notes.md
            sed -i '/./,$!d' /tmp/release_notes.md
            sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release_notes.md

            if [[ -s /tmp/release_notes.md ]]; then
              echo "Found release notes for v${VERSION} in tag annotation"
              echo "has_notes=true" >> $GITHUB_OUTPUT
            else
              echo "No release notes found for v${VERSION}, using GoReleaser default"
              echo "has_notes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ steps.release_notes.outputs.has_notes == 'true' && '--release-notes /tmp/release_notes.md' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
